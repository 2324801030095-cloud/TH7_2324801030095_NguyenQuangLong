server:
  port: 8761

eureka:
  server:
    waitTimeInMsWhenSyncEmpty: 0
    expectedClientRenewalIntervalSeconds: 60
    renewalPercentThreshold: 0.75
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
